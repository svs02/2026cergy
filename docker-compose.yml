services:
  mongodb:
    image: mongo:7
    container_name: cergy2026-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cergy2026

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cergy2026-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/cergy2026
      - SESSION_SECRET=local-dev-secret-change-in-production
      - CLIENT_URL=http://localhost:3000
      - ADMIN_PASSWORD_HASH=$$2b$$10$$IGS4ZSiA7Dc1cSSN15btt.ksDK4BN5.rCjp00EBEVHEBZBjiXcDlK

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: cergy2026-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
